<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <title>Track Details | AZ10</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../styles/base/variables.css">
    <link rel="stylesheet" href="../styles/base/reset.css">
    <link rel="stylesheet" href="../styles/base/global.css">
    <link rel="stylesheet" href="../styles/components/header.css">
    <link rel="stylesheet" href="../styles/components/content.css">
    <link rel="stylesheet" href="../styles/pages/track/track-content.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="track-page">

    <!-- Side Panel -->
    <aside class="side-panel">
        <!-- Will be loaded via components.js -->
    </aside>

    <!-- nav-container -->
    <div class="nav-container">
        <!-- Will be loaded via components.js -->
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Track Content -->
        <section class="track-content">
            <div class="track-container">
                <!-- ستون سمت چپ - عکس کاور -->
                <div class="track-cover-column">
                    <div class="track-cover">
                        <img id="coverArt" src="" alt="Track Cover" class="cover-image">
                    </div>

                    <!-- دکمه‌های استریم در پایین کاور -->
                    <div class="streaming-platforms mobile-hidden">
                        <h3>Listen On</h3>
                        <div id="platformLinks" class="platform-links">
                            <!-- Platform links will be generated dynamically -->
                        </div>
                    </div>
                </div>

                <!-- ستون سمت راست - اطلاعات -->
                <div class="track-info-column">
                    <!-- هدر ترک -->
                    <div class="track-header">
                        <h1 id="trackTitle" class="track-title">Loading...</h1>
                        <div class="artist-info">
                            <img id="artistAvatar" src="" alt="" class="artist-avatar">
                            <span id="artistName" class="artist-name">Loading...</span>
                        </div>

                        <!-- Rating Display -->
                        <div class="rating-display">
                            <div class="rating-score">
                                <span id="ratingScore" class="score">0.0</span>
                                <span class="total">/10</span>
                            </div>
                            <div class="rating-meta">
                                <span id="votesCount" class="votes-count">0 votes</span>
                                <span class="rating-label">Community Rating</span>
                            </div>
                        </div>

                        <div class="track-actions">
                            <button class="action-btn rate-btn">
                                <i class="fas fa-star"></i>
                                Rate
                            </button>
                            <button class="action-btn share-btn">
                                <i class="fas fa-share"></i>
                                Share
                            </button>
                        </div>
                    </div>

                    <!-- اطلاعات تکمیلی ترک -->
                    <div id="trackDetails" class="track-details">
                        <!-- جزئیات اصلی -->
                        <div class="detail-group">
                            <h3>Track Info</h3>
                            <div id="trackInfoDetails">
                                <!-- Track info details will be generated dynamically -->
                            </div>
                        </div>

                        <!-- Credits Section -->
                        <div id="creditsSection" class="detail-group">
                            <h3>Credits</h3>
                            <div id="creditsDetails">
                                <!-- Credits will be generated dynamically -->
                            </div>
                        </div>

                        <!-- Lyrics Section -->
                        <div id="lyricsSection" class="detail-group">
                            <h3>Lyrics</h3>
                            <div class="lyrics-content">
                                <p id="lyricsText" dir="rtl" class="lyrics-text">
                                    <!-- Lyrics will be loaded here -->
                                </p>
                                <button class="expand-lyrics">Read More</button>
                            </div>
                        </div>

                        <!-- Streaming Platforms (نمایش در موبایل) -->
                        <div class="streaming-platforms desktop-hidden">
                            <h3>Listen On</h3>
                            <div id="mobilePlatformLinks" class="platform-links">
                                <!-- Platform links for mobile will be generated dynamically -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
    </div>

    <!-- Scripts -->
    <script defer src="../js/core/components.js"></script>
    <script defer src="../js/core/theme.js"></script>
    <script defer src="../js/core/navigation.js"></script>
    <script defer src="../js/track-details.js"></script>
</body>

</html>
