<!-- Track Details Page Component - Redesigned -->
<div class="track-details-page">
    <!-- Track Header Section with Title and Artist -->
    <div class="track-header">
        <h1 class="track-title" id="track-title">Track Title</h1>
        <h2 class="track-artist" id="track-artist">Artist Name</h2>
    </div>

    <!-- Main Content Container -->
    <div class="track-main-container">
        <!-- Left Side Content -->
        <div class="track-left-content">
            <!-- Track Rating -->
            <div class="track-rating">
                <div class="rating-display">
                    <span class="rating-value" id="track-rating-value">0.0</span>
                    <div class="stars" id="track-rating-stars">
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                    </div>
                    <span class="rating-votes" id="track-rating-votes">(0 votes)</span>
                </div>
            </div>

            <!-- Additional Track Info -->
            <div class="track-extra-info">
                <div class="info-item" id="track-duration-item">
                    <i class="fas fa-clock"></i>
                    <span id="track-duration">3:24</span>
                </div>
                <div class="info-item" id="track-release-item" style="display: none;">
                    <i class="fas fa-calendar"></i>
                    <span id="track-release-date"></span>
                </div>
            </div>
        </div>

        <!-- Center - Large Circular Cover Image -->
        <div class="track-cover-center">
            <div class="cover-container">
                <img id="track-cover" src="" alt="Track Cover" class="cover-image">
                <div class="cover-overlay">
                    <i class="fas fa-play play-icon"></i>
                </div>
            </div>
        </div>

        <!-- Right Side Content -->
        <div class="track-right-content">
            <!-- Streaming Links -->
            <div class="streaming-section">
                <h3 class="section-title">Listen On</h3>
                <div class="streaming-links" id="streaming-links-compact">
                    <!-- Streaming links will be populated by JavaScript -->
                </div>
            </div>

            <!-- Track Metadata -->
            <div class="track-metadata-section">
                <h3 class="section-title">Details</h3>
                <div class="metadata-grid">
                    <div class="meta-item" id="track-label-item" style="display: none;">
                        <span class="meta-label">Label</span>
                        <span class="meta-value" id="track-label"></span>
                    </div>
                    <div class="meta-item" id="track-beat-producer-item" style="display: none;">
                        <span class="meta-label">Beat Producer</span>
                        <span class="meta-value" id="track-beat-producer"></span>
                    </div>
                    <div class="meta-item" id="track-sound-engineer-item" style="display: none;">
                        <span class="meta-label">Sound Engineer</span>
                        <span class="meta-value" id="track-sound-engineer"></span>
                    </div>
                    <div class="meta-item" id="track-project-manager-item" style="display: none;">
                        <span class="meta-label">Project Manager</span>
                        <span class="meta-value" id="track-project-manager"></span>
                    </div>
                    <div class="meta-item" id="track-art-direction-item" style="display: none;">
                        <span class="meta-label">Art Direction</span>
                        <span class="meta-value" id="track-art-direction"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Section - SoundCloud Embed -->
    <div class="track-bottom-section">
        <div class="soundcloud-container">
            <div class="track-soundcloud-embed" id="track-soundcloud-embed">
                <!-- SoundCloud embed will be populated by JavaScript -->
            </div>
        </div>
    </div>
</div>
