<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="description" content="AZ10 - Latest Drops in Persian Hip-Hop">
    <title>AZ10 | Latest Drops</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../src/styles/base/variables.css">
    <link rel="stylesheet" href="../src/styles/base/reset.css">
    <link rel="stylesheet" href="../src/styles/base/typography.css">
    <link rel="stylesheet" href="../src/styles/base/global.css">
    <link rel="stylesheet" href="../src/styles/components/panel.css">
    <link rel="stylesheet" href="../src/styles/components/content.css">
    <link rel="stylesheet" href="../src/styles/components/track-card.css">
    <link rel="stylesheet" href="../src/styles/components/animations.css">
    <link rel="stylesheet" href="../src/styles/components/main-header.css">
    <link rel="stylesheet" href="../src/styles/components/search.css">
    <link rel="stylesheet" href="../src/styles/components/fullscreen.css">

    <link rel="stylesheet" href="../src/styles/components/carousel.css">
    <link rel="stylesheet" href="../src/styles/pages/track/track-content.css">
    <link rel="stylesheet" href="../src/styles/pages/new-drops/new-drops.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Theme controller script - Load as regular script, not as module -->
    <script src="../src/js/core/theme.js"></script>

    <!-- Platform Initialization Script (loads common functionality, including fullscreen) -->
    <script type="module" src="../src/js/core/init.js"></script>
</head>

<body class="page-new-drops">
    <!-- Side Panel -->
    <div id="side-panel" class="panel"></div>

    <!-- Main Content -->
    <main id="main-content" class="content">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Mainstream Latest Drops</h1>
            <p class="page-description">
                The newest releases from established artists in the Persian hip-hop scene. Discover, listen, and rate
                the latest tracks.
            </p>
        </div>

        <!-- Filter and View Options -->
        <div class="filter-section">
            <div class="filter-group">
                <span class="filter-label">Sort by:</span>
                <div class="custom-select-wrapper">
                    <div class="custom-select">
                        <div class="custom-select-trigger" id="selected-option">Newest First</div>
                        <div class="custom-options">
                            <span class="custom-option selected" data-value="newest">Newest First</span>
                            <span class="custom-option" data-value="oldest">Oldest First</span>
                            <span class="custom-option" data-value="top-ratings">Top Ratings</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="view-controls">
                <div class="view-options">
                    <button class="view-toggle-btn active" data-view="grid" title="Grid View">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button class="view-toggle-btn" data-view="list" title="List View">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tracks Grid -->
        <div id="allTracks" class="tracks-grid view-grid">
            <!-- Tracks will be added here via JavaScript -->
            <div class="loading-placeholder">Loading tracks...</div>
        </div>
    </main>

    <!-- Error Messages -->
    <div id="errorContainer" class="error-container" style="display: none;">
        <p class="error-message"></p>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Core Scripts -->
    <script src="../src/js/core/components.js"></script>
    <script src="../src/js/core/navigation.js"></script>
    <script src="../src/js/core/border.js"></script>
    <script src="../src/js/core/router.js"></script>
    <script src="../src/js/core/fullscreen.js"></script>


    <!-- Search Component -->
    <script src="../src/js/components/search.js"></script>

    <!-- Track Card Component -->
    <script type="module" src="../src/components/shared/TrackCard/track-card.js"></script>

    <!-- Common UI Elements -->
    <script type="module">
        import { initCommonElements } from '../src/components/shared/Layout/common-elements.js';
        document.addEventListener('DOMContentLoaded', initCommonElements);
    </script>

    <!-- Page Specific Script -->
    <script type="module">
        import { initViewToggle } from '../src/js/utils/view-toggle.js';
        import { TrackCard } from '../src/components/shared/TrackCard/track-card.js';

        // Initialize view toggle
        initViewToggle('#allTracks');

        document.addEventListener('DOMContentLoaded', function () {
            // Initialize custom select
            initCustomSelect();

            // Load tracks initially
            loadTracks('newest');

            // Manually handle theme toggle for this page
            const themeToggleBtn = document.getElementById('submenuThemeToggle');
            if (themeToggleBtn) {
                console.log('Found theme toggle button, setting up event listener');
                // Remove existing onclick attribute
                themeToggleBtn.removeAttribute('onclick');

                // Add direct event listener
                themeToggleBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    console.log('Theme toggle clicked');
                    if (typeof window.toggleTheme === 'function') {
                        window.toggleTheme();
                    } else {
                        console.error('toggleTheme function not available');
                    }
                    return false;
                });
            } else {
                console.warn('Theme toggle button not found in DOM');
            }
        });

        /**
         * Initialize the custom select dropdown
         */
        function initCustomSelect() {
            const customSelect = document.querySelector('.custom-select');
            const customOptions = document.querySelectorAll('.custom-option');
            const selectedOption = document.getElementById('selected-option');

            // Toggle custom select open/closed
            customSelect.addEventListener('click', function (event) {
                this.classList.toggle('opened');
                event.stopPropagation();
            });

            // Close select when clicking elsewhere
            document.addEventListener('click', function () {
                customSelect.classList.remove('opened');
            });

            // Handle option selection
            customOptions.forEach(option => {
                option.addEventListener('click', function () {
                    // Update selected text
                    selectedOption.textContent = this.textContent;

                    // Update selected class
                    customOptions.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');

                    // Show loading state
                    if (window.showLoading) {
                        window.showLoading();
                    }

                    // Load tracks with the selected value
                    loadTracks(this.getAttribute('data-value'));
                });
            });
        }

        /**
         * Load tracks from the data file and display them in the grid
         * @param {string} sortOption - 'newest', 'oldest', or 'top-ratings'
         */
        async function loadTracks(sortOption = 'newest') {
            try {
                const loadingPlaceholder = document.querySelector('.loading-placeholder');
                if (loadingPlaceholder) {
                    loadingPlaceholder.textContent = 'Loading tracks...';
                }

                // Show loading indicator if available
                if (window.showLoading) {
                    window.showLoading();
                }

                // Fetch tracks data
                const response = await fetch('../src/data/tracks.json');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();

                // Sort tracks based on selected option
                let tracks = [...data.tracks]; // Create a copy of the array

                if (sortOption === 'newest') {
                    tracks.sort((a, b) => {
                        const dateA = new Date(a.basicInfo.releaseDate);
                        const dateB = new Date(b.basicInfo.releaseDate);
                        return dateB - dateA; // Newest first
                    });
                } else if (sortOption === 'oldest') {
                    tracks.sort((a, b) => {
                        const dateA = new Date(a.basicInfo.releaseDate);
                        const dateB = new Date(b.basicInfo.releaseDate);
                        return dateA - dateB; // Oldest first
                    });
                } else if (sortOption === 'top-ratings') {
                    tracks.sort((a, b) => {
                        const ratingA = a.stats.communityRating || 0;
                        const ratingB = b.stats.communityRating || 0;
                        return ratingB - ratingA; // Highest rating first
                    });
                }

                // Display tracks in the grid
                const tracksContainer = document.getElementById('allTracks');
                if (tracksContainer) {
                    // Clear previous content
                    tracksContainer.innerHTML = '';

                    // Add each track card to the container
                    tracks.forEach(trackData => {
                        const trackCardInstance = new TrackCard(trackData);
                        tracksContainer.appendChild(trackCardInstance.element);
                    });
                }

                // Hide loading indicator if available
                if (window.hideLoading) {
                    window.hideLoading();
                }
            } catch (error) {
                console.error('Error loading tracks:', error);

                // Show error message
                if (window.showError) {
                    window.showError('Failed to load tracks. Please try again later.');
                }

                const loadingPlaceholder = document.querySelector('.loading-placeholder');
                if (loadingPlaceholder) {
                    loadingPlaceholder.textContent = 'Error loading tracks. Please try again later.';
                }
            }
        }
    </script>

    <!-- Ensure theme toggle function is available globally -->
    <script>
        // Make sure toggleTheme function is available globally
        if (typeof window.toggleTheme !== 'function') {
            window.toggleTheme = function () {
                const html = document.documentElement;
                const currentTheme = html.getAttribute('data-theme') || 'dark';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);

                console.log('Theme toggled to ' + newTheme);

                // Trigger custom event for other components
                const event = new CustomEvent('az10themechange', {
                    detail: { theme: newTheme }
                });
                document.dispatchEvent(event);

                return newTheme;
            };
            console.log('Global toggleTheme function created');
        }
    </script>
</body>

</html>
