<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="description" content="AZ10 - Persian Hip-Hop Rating Platform">
    <title>AZ10 | Persian Hip-Hop Ratings</title>

    <!-- Styles -->
    <link rel="stylesheet" href="../src/styles/base/variables.css">
    <link rel="stylesheet" href="../src/styles/base/reset.css">
    <link rel="stylesheet" href="../src/styles/base/global.css">
    <link rel="stylesheet" href="../src/styles/components/panel.css">
    <link rel="stylesheet" href="../src/styles/components/content.css">
    <link rel="stylesheet" href="../src/styles/components/track-card.css">
    <link rel="stylesheet" href="../src/styles/components/animations.css">
    <link rel="stylesheet" href="../src/styles/pages/track/track-content.css">
    <!-- Note: CSS Module loaded via JavaScript -->

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="home-page">
    <!-- Side Panel -->
    <div id="side-panel" class="panel"></div>

    <!-- Main Content -->
    <main id="main-content" class="content">
        <!-- Combined Page Info Header -->
        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-icon"><i class="fa-solid fa-music"></i></span>
                <div class="stat-content">
                    <span class="stat-value">؟؟</span>
                    <span class="stat-label">New Releases This Month</span>
                </div>
            </div>

            <div class="stat-box">
                <span class="stat-icon"><i class="fa-solid fa-users"></i></span>
                <div class="stat-content">
                    <span class="stat-value">12.5K</span>
                    <span class="stat-label">Community Members</span>
                </div>
            </div>

            <div class="stat-box">
                <span class="stat-icon"><i class="fa-solid fa-microphone"></i></span>
                <div class="stat-content">
                    <span class="stat-value">148</span>
                    <span class="stat-label">Featured Artists</span>
                </div>
            </div>

            <div class="stat-box">
                <span class="stat-icon"><i class="fa-solid fa-headphones"></i></span>
                <div class="stat-content">
                    <span class="stat-value">782</span>
                    <span class="stat-label">Total Tracks</span>
                </div>
            </div>
        </div>

        <!-- Mainstream Tracks Section -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title">Mainstream Latest Drops</h2>
                <p class="subtitle">Top releases from well-known artists</p>
            </div>

            <div class="view-options">
                <div class="view-toggle">
                    <button class="view-toggle-btn active" data-view="grid">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button class="view-toggle-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="mainstreamTracks" class="tracks-grid view-grid">
                <!-- Tracks will be added here via JavaScript -->
                <div class="loading-placeholder">Loading tracks...</div>
            </div>
        </section>

        <!-- New Wave Tracks Section -->
        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title">New Wave</h2>
                <p class="subtitle">Fresh releases from emerging artists</p>
            </div>

            <div class="view-options">
                <div class="view-toggle">
                    <button class="view-toggle-btn active" data-view="grid">
                        <i class="fas fa-th-large"></i>
                    </button>
                    <button class="view-toggle-btn" data-view="list">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>

            <div id="newWaveTracks" class="tracks-grid view-grid">
                <!-- Tracks will be added here via JavaScript -->
                <div class="loading-placeholder">Loading tracks...</div>
            </div>
        </section>
    </main>

    <!-- Error Messages -->
    <div id="errorContainer" class="error-container" style="display: none;">
        <p class="error-message"></p>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Core Scripts -->
    <script src="../src/js/core/components.js"></script>
    <script src="../src/js/core/theme.js"></script>
    <script src="../src/js/core/navigation.js"></script>
    <script src="../src/js/core/border.js"></script>

    <!-- Track Card Component -->
    <script type="module" src="../src/components/shared/TrackCard/track-card.js"></script>

    <!-- Main App Script -->
    <script type="module" src="../src/js/index.js"></script>
</body>

</html>
