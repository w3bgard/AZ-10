<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ10</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./src/styles/variables.css">
    <link rel="stylesheet" href="./src/styles/typography-overrides.css">
    <link rel="stylesheet" href="./src/styles/global.css">
    <link rel="stylesheet" href="./src/styles/navigation.css">
    <link rel="stylesheet" href="./src/styles/content.css">
    <link rel="stylesheet" href="./src/styles/utility-controls.css">
    <link rel="stylesheet" href="./src/styles/timeline.css">
    <link rel="stylesheet" href="./src/styles/team.css">
    <link rel="stylesheet" href="./src/styles/home.css">
    <link rel="stylesheet" href="./src/styles/track-card.css">
    <link rel="stylesheet" href="./src/styles/tracks-listing.css">
    <link rel="stylesheet" href="./src/styles/track-details.css">

    <!-- Fonts (optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
    <div id="main-container">
        <!-- Utility Controls Container -->
        <div id="utility-controls-container">
            <div class="utility-control">
                <button id="profile-button" aria-label="Profile" title="Profile">
                    <!-- Profile icon will be added via CSS -->
                </button>
            </div>
            <div class="utility-control">
                <button id="more-button" aria-label="More Settings" title="More Settings">
                    <!-- More icon will be added via CSS -->
                </button>
            </div>
        </div>

        <!-- Header section will be dynamically populated -->
        <header id="main-header"></header>

        <!-- Main content area -->
        <main id="app-content">
            <div class="main-content">
                <!-- Page content will be dynamically inserted here -->
            </div>
        </main>

        <!-- No footer as per requirements -->
    </div>

    <!-- JS (Defer loading) -->
    <script type="module" src="./src/js/main.js" defer></script>
    <script type="module" src="./src/js/router.js" defer></script>
    <script type="module" src="./src/js/home.js" defer></script>
    <script type="module" src="./src/js/team.js" defer></script>
    <script type="module" src="./src/js/tracks-listing.js" defer></script>
    <script type="module" src="./src/js/track-details.js" defer></script>

    <script type="module" src="./src/js/more-settings.js" defer></script>
    <script type="module" src="./src/js/profile.js" defer></script>
    <script type="module" src="./src/js/menu.js" defer></script>

    <script type="module" src="./src/js/portfolio-timeline.js" defer></script>
    <script type="module" src="./src/js/scroll-enhancements.js" defer></script>
</body>

</html>
